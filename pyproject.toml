[project]
name = "mbai-platform"
version = "0.1.0"
description = "本地 AI 能力平台：统一模型池 + 统一队列 + 网页/Agent 双入口"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "mousebomb" }]
keywords = ["comfyui", "stable-diffusion", "tts", "mcp", "fastapi", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyyaml>=6.0",
    # multipart 表单（/v1/assets 上传）必需；FastAPI 不内置
    "python-multipart>=0.0.9",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/mousebomb/mbai-platform"
Repository = "https://github.com/mousebomb/mbai-platform"
Issues = "https://github.com/mousebomb/mbai-platform/issues"

[project.scripts]
mbai = "platform_core.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_core"]

[tool.uv]
package = true
