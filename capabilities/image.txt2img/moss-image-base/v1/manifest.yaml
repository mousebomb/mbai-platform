capability: image.txt2img
variant: moss-image-base
version: v1
title: "MOSS-Image 5B Base 文生图"
description: >-
  原生版式控制文生图。prompt 传字符串即为普通文生图；
  传 MOSS Layout JSON 对象可指定每个文本块/物体的 bbox（画布二期直接产出该结构）。
model_id: moss-image-base-int8
workflow: workflow.json
engine: comfy
maturity: L1

inputs:
  prompt:
    type: prompt
    required: true
  negative_prompt:
    type: string
    default: "nsfw, worst quality, bad anatomy, watermark, jpeg artifact"
  width:
    type: int
    default: 1024
    min: 256
    max: 2048
    multiple_of: 16
  height:
    type: int
    default: 1024
    min: 256
    max: 2048
    multiple_of: 16
  steps:
    type: int
    default: 25
    min: 8
    max: 100
  cfg:
    type: float
    default: 2.5
  seed:
    type: int
    default: -1
  sampler_name:
    type: string
    default: er_sde
  scheduler:
    type: string
    default: simple
  slg_layers:
    type: string
    default: "22"

bindings:
  "4.inputs.text": prompt
  "5.inputs.text": negative_prompt
  "6.inputs.width": width
  "6.inputs.height": height
  "7.inputs.seed": seed
  "7.inputs.steps": steps
  "7.inputs.cfg": cfg
  "7.inputs.sampler_name": sampler_name
  "7.inputs.scheduler": scheduler
  "15.inputs.single_layers": slg_layers

constants:
  batch_size: 1

guidance:
  when_to_use: >-
    需要 base 权重的原始风格、不要求 SFT 那种版面收敛时用；日常版式任务仍用 moss-image-sft。
  avoid_when: >-
    默认不要选：50 步约 79s，是 sft 的 1.8 倍，没有可见收益。本机只跑过 2 次，耗时不可靠。
  cost: >-
    1024x1024 / 50 步约 79s（n=2，样本不足，不要当精确值）。
