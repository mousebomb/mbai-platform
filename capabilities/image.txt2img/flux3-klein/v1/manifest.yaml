capability: image.txt2img
variant: flux3-klein
version: v1
title: "FLUX 3 Image Klein 5.6B（蒸馏 int8）"
description: >-
  BFL 2026-10 开源的 5.6B 蒸馏版，4~16 步、cfg 固定 1.0，官方 int8 量化。
  文本编码器是 Qwen3-VL-4B，全套 11 GiB，12GB 卡能整份驻留，不靠 Q3 量化硬压。
model_id: flux3-image-klein
workflow: workflow.json
engine: comfy
maturity: L1

inputs:
  prompt:
    type: prompt
    required: true
  width:
    type: int
    default: 1024
    min: 512
    max: 2048
    multiple_of: 16
  height:
    type: int
    default: 1024
    min: 512
    max: 2048
    multiple_of: 16
  steps:
    type: int
    default: 15
    min: 4
    max: 30
    # 官方蒸馏区间是 4~16，超过 16 不会更细、只会更慢；
    # 这里不卡死在 16，是因为通用调用方（smoke-test 等）会直接给 25，拒绝比变慢更糟
  seed:
    type: int
    default: -1

# 三种模型文件按角色注入，具体文件由 profiles/*.yaml 决定（本机可换 bf16 / nvfp4 档）
model_bind:
  diffusion_model: "1.inputs.unet_name"
  text_encoder: "2.inputs.clip_name"
  vae: "7.inputs.vae_name"

bindings:
  "3.inputs.text": prompt
  "5.inputs.width": width
  "5.inputs.height": height
  "6.inputs.seed": seed
  "6.inputs.steps": steps
  "6.inputs.cfg": cfg
  "6.inputs.sampler_name": sampler_name
  "6.inputs.scheduler": scheduler

constants:
  # 蒸馏版只认这一组：官方模板 15 步 / cfg 1 / er_sde / simple。
  # 三个都固定在 constants 里，不从 inputs 暴露——乱改采样器只会出一张糊图，不会报错。
  cfg: 1.0
  sampler_name: er_sde
  scheduler: simple

guidance:
  when_to_use: >-
    默认出图档：写实照片、产品图、材质与光影。用 288 张历史 prompt 重跑对比，
    它在质感/细节/景深上全面强于 z-image-turbo，而且速度不吃亏
    （512² 4.1s、768² 8.1s、1024² 12.2s，对 z-image 的 8.1/10.2/12.2 还略好）。
    也是批量草稿档：512² 4.1 秒一张，适合先试构图。
  avoid_when: >-
    要某种明确的图形风格（等距 / 线框 / 扁平图标 / 2.5D）时用 z-image-turbo，
    它的服从性明显更好，本变体会把抽象风格指令渲染成写实。
    中文文字/排版用 moss-image-sft——本变体会硬写字，但字形是错的。
    4K 以上大图不要在 12GB 卡上硬上，会频繁换页。
  cost: >-
    512² 4.1s / 768² 8.1s / 1024² 12.2s（中位数，15 步）。首次调用另加 25~40s 加载。
    权重 11 GiB 常驻，跑完不卸载。
