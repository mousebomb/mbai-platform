capability: image.txt2img
variant: moss-image-sft
version: v1
title: "MOSS-Image 5B SFT 文生图"
description: >-
  精调版：文字分组与版式更整齐，日常出图优先用这个变体。
  prompt 可以是普通字符串，也可以是 MOSS Layout JSON 对象。
model_id: moss-image-sft-int8
workflow: workflow.json
engine: comfy
maturity: L2

inputs:
  prompt:
    type: prompt
    required: true
  negative_prompt:
    type: string
    default: "nsfw, worst quality, bad anatomy, watermark, jpeg artifact"
  width:
    type: int
    default: 1024
    min: 256
    max: 2048
    multiple_of: 16
  height:
    type: int
    default: 1024
    min: 256
    max: 2048
    multiple_of: 16
  steps:
    type: int
    default: 25
    min: 8
    max: 100
  cfg:
    type: float
    default: 2.5
  seed:
    type: int
    default: -1
  sampler_name:
    type: string
    default: er_sde
  scheduler:
    type: string
    default: simple
  slg_layers:
    type: string
    default: "22"

bindings:
  "4.inputs.text": prompt
  "5.inputs.text": negative_prompt
  "6.inputs.width": width
  "6.inputs.height": height
  "7.inputs.seed": seed
  "7.inputs.steps": steps
  "7.inputs.cfg": cfg
  "7.inputs.sampler_name": sampler_name
  "7.inputs.scheduler": scheduler
  "15.inputs.single_layers": slg_layers

constants:
  batch_size: 1

guidance:
  when_to_use: >-
    任何带文字、版式、分栏、标题的需求：prompt 可以是 Layout JSON（bbox + 每个元素的 caption），
    中文小字可控。这是本平台唯一能可靠出中文排版的变体——flux3-klein 会把字形写错，
    z-image-turbo 会直接省略文字。
  avoid_when: >-
    纯写实 / 风景 / 人像且不需要文字——44s 太贵，用 flux3-klein（12.2s）。
  cost: >-
    1024x1024 / 25 步 44s，1088x1472 / 25 步 67s。样本量少（n=3），数字取中位数。
