capability: image.txt2img
variant: z-image-turbo
version: v1
title: "Z-Image Turbo 6B 快速出图"
description: >-
  8 步 turbo 蒸馏模型，秒级出图档，适合快速预览。
  cfg 默认 1.0；negative_prompt 只在 cfg > 1 时生效（cfg=1.0 下负向被完全乘 0）。
model_id: z-image-turbo
workflow: workflow.json
engine: comfy
maturity: L1

inputs:
  prompt:
    type: prompt
    required: true
  negative_prompt:
    # 只有 cfg > 1 时生效：cfg=1.0 下 KSampler 完全不用负向分支
    type: string
    default: ""
  width:
    type: int
    default: 1024
    min: 512
    max: 2048
    multiple_of: 16
  height:
    type: int
    default: 1024
    min: 512
    max: 2048
    multiple_of: 16
  steps:
    type: int
    default: 8
    min: 4
    max: 20
  cfg:
    type: float
    default: 1.0
  seed:
    type: int
    default: -1
  sampler_name:
    type: string
    default: res_multistep
  scheduler:
    type: string
    default: simple

bindings:
  "4.inputs.text": prompt
  "5.inputs.text": negative_prompt
  "6.inputs.width": width
  "6.inputs.height": height
  "7.inputs.seed": seed
  "7.inputs.steps": steps
  "7.inputs.cfg": cfg
  "7.inputs.sampler_name": sampler_name
  "7.inputs.scheduler": scheduler
  "2.inputs.shift": shift

# 三个模型文件按「角色」注入，具体用哪个文件由 profiles/*.yaml 决定（本机可换量化档）
model_bind:
  diffusion_model: "1.inputs.unet_name"
  text_encoder: "3.inputs.clip_name"
  vae: "8.inputs.vae_name"

constants:
  shift: 3

guidance:
  when_to_use: >-
    需要「某种具体图形风格」时首选：等距 / 线框 / 扁平图标 / 2.5D / 动漫插画。
    实测同一句「深色蓝图 · 技术工程线稿」，它老实画等距线框 + 三面文字，
    而 flux3-klein 会跑偏成写实金属块加全息反光。
  avoid_when: >-
    写实照片、产品图、材质光影——用 flux3-klein，质量高一档且速度不吃亏
    （1024² 都是 12.2s，512² flux3 只要 4.1s，比本变体的 8.1s 还快）。
    中文文字/排版一律不接，它会直接把文字省略掉。
  cost: >-
    512² 8.1s / 768² 10.2s / 1024² 12.2s（中位数，8 步）。首次调用另加 25~40s 模型加载。
