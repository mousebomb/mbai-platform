capability: image.upscale
variant: realesrgan-anime
version: v1
title: "Real-ESRGAN 动漫超分（animevideov3）"
description: >-
  动漫向 4x 超分，realesr-animevideov3 模型，本地 ncnn-vulkan 执行，不走 ComfyUI。
model_id: realesr-animevideov3
engine: cli
maturity: L1

cli:
  command:
    - '{tools_dir}\realesrgan\realesrgan-ncnn-vulkan.exe'
    - '-i'
    - '{image}'
    - '-o'
    - '{out}'
    - '-n'
    - '{model_name}'
    - '-s'
    - '{scale}'
    - '-f'
    - 'png'
  timeout_sec: 900
  output_ext: png

inputs:
  image:
    type: image
    required: true
  scale:
    type: int
    default: 4
    min: 2
    max: 4

constants:
  model_name: realesr-animevideov3
