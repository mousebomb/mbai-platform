id: flux3-image-klein
name: FLUX 3 Image Klein 5.6B (int8)
family: flux3
# 量化衍生：由 bf16 上游转 int8（convrot），可用 profile 换成 bf16/nvfp4 档
kind: quantized
license: flux-kommunity
# FLUX Kommunity License：个人与年收入 500 万美元以下的公司可免费商用；
# 更大的组织需要 BFL 的自托管商业授权
commercial_ok: true
vram_profile: degraded
files:
  diffusion_model: diffusion_models/flux3-image-klein-int8-convrot.safetensors
  text_encoder: text_encoders/qwen3vl_4b_int8_convrot.safetensors
  vae: vae/flux2-vae.safetensors
lineage:
  base: flux3_image_klein_bf16
  quant: int8_convrot
# gated 仓库：下载前必须在 HF 上接受许可协议，并且本机要有 HF_TOKEN（见 .env）
source:
  type: huggingface
  repo: black-forest-labs/flux-3-image-klein-comfy
  files:
    - remote: diffusion_models/flux3-image-klein-int8-convrot.safetensors
      local: diffusion_models/flux3-image-klein-int8-convrot.safetensors
      min_gb: 5.4
    - remote: text_encoders/qwen3vl_4b_int8_convrot.safetensors
      local: text_encoders/qwen3vl_4b_int8_convrot.safetensors
      min_gb: 4.5
    - remote: vae/flux2-vae.safetensors
      local: vae/flux2-vae.safetensors
      min_gb: 0.3
notes: >-
  5.6B 蒸馏版，4~16 步、cfg 固定 1.0，官方 int8 量化。
  全套 11.0 GiB 是三者里唯一能整份塞进 12GB 的组合（文本编码器 Qwen3-VL-4B 4.86 GB，
  比主干文件还小，和 MiniMax H3 那种编码器比主干大的结构相反）。
  权重是 gated 仓库，prompt upsampler（Qwen3.5 9B，6.7 GB）刻意不下——12GB 上开不起，
  变体直接不带那个节点。
  本机实测（RTX 3060 12GB）：1024x1024 / 15 步热态 12.5s，首跑 16.6s。
